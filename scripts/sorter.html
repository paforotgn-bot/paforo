<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clasificar fotos</title>
<style>
:root{--bg:#0e0f1a;--panel:#171826;--tx:#e8e8f0;--mut:#9a9ab0;--acc:#7c5cff;--ok:#2b8a5b;--bad:#c0435a}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;height:100vh;overflow:hidden}
header{padding:8px 14px;background:#12132a;border-bottom:1px solid #2a2b45;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header b{font-size:15px}.mut{color:var(--mut);font-size:13px}.sp{flex:1}
.tabs button{background:#22233a}.tabs button.on{background:var(--acc)}
.bar{height:6px;background:#2a2b45;border-radius:4px;width:220px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--acc)}
button{background:var(--acc);color:#fff;border:0;padding:7px 11px;border-radius:7px;font-weight:600;cursor:pointer;font-size:12px}
button.g{background:#33344f}
main{flex:1;display:flex;min-height:0}
.content{flex:1;min-width:0;position:relative;overflow:auto}
.side{width:320px;background:var(--panel);border-left:1px solid #2a2b45;padding:12px;overflow:auto}
.side h3{margin:6px 0 8px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
.alb{border:1px solid #2a2b45;border-radius:9px;margin:6px 0;overflow:hidden}
.alb>.h{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#1e2036;cursor:pointer}
.alb>.h .k{background:var(--acc);color:#fff;border-radius:6px;min-width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.alb>.h .nm{font-weight:600;flex:1}.alb>.h .cn{color:var(--mut);font-size:12px}
.alb.pending{outline:2px solid var(--acc)}
.subs{padding:4px 10px 8px 42px}.sub{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;cursor:pointer}
.sub .k{background:#33344f;color:#fff;border-radius:5px;min-width:34px;height:20px;display:inline-flex;align-items:center;justify-content:center;font-size:11px}
.sub .cn{color:var(--mut);font-size:11px;margin-left:auto}
/* one */
.stage{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
.stage img{max-width:100%;max-height:calc(100vh - 150px);object-fit:contain;border-radius:8px;background:#000}
.cap{margin-top:8px;color:var(--mut);font-size:13px;text-align:center}.cap .done{color:var(--ok);font-weight:600}
.toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:6px 14px;border-radius:20px;font-weight:600;font-size:13px;opacity:0;transition:opacity .15s;pointer-events:none;z-index:5}.toast.show{opacity:1}
/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;padding:10px}
.tile{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;cursor:pointer;background:#222;border:3px solid transparent}
.tile img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.tile.sel{border-color:var(--acc)}
.tile .badge{position:absolute;bottom:2px;left:2px;background:rgba(0,0,0,.7);color:#fff;border-radius:4px;font-size:10px;padding:1px 5px}
.tile.tr{opacity:.4}.tile.tr .badge{background:var(--bad)}
/* dupes */
.dupes{padding:12px}
.grp{border:1px solid #2a2b45;border-radius:10px;padding:8px;margin:10px 0;background:var(--panel)}
.grp .row{display:flex;gap:6px;flex-wrap:wrap}
.grp .gh{display:flex;gap:10px;align-items:center;margin-bottom:6px;font-size:13px}
.dt{position:relative;width:110px;height:110px;border-radius:6px;overflow:hidden;cursor:pointer;border:3px solid var(--ok)}
.dt img{width:100%;height:100%;object-fit:cover}
.dt.kill{border-color:var(--bad);opacity:.5}
.dt .tag{position:absolute;top:2px;left:2px;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;background:var(--ok);color:#fff}
.dt.kill .tag{background:var(--bad)}
kbd{background:#0e0f22;border:1px solid #3a3b57;border-radius:4px;padding:1px 6px;font-size:11px}
.help{font-size:11.5px;color:var(--mut);line-height:1.6;margin-top:10px;border-top:1px solid #2a2b45;padding-top:8px}
</style></head><body>
<header>
 <b>⚡ Clasificar</b>
 <span class="tabs"><button id="t-one" class="on" onclick="setView('one')">1 a 1</button><button id="t-grid" class="g" onclick="setView('grid')">Cuadrícula</button><button id="t-dupes" class="g" onclick="setView('dupes')">Duplicados</button></span>
 <div class="bar"><i id="prog" style="width:0%"></i></div>
 <span class="mut" id="cnt"></span>
 <span class="sp"></span>
 <span class="mut" id="selinfo"></span>
 <button class="g" onclick="prev()">◀</button><button class="g" onclick="skip()">▶</button>
 <button onclick="newAlbum()">＋ Álbum</button>
</header>
<main>
 <div class="content">
   <div class="toast" id="toast"></div>
   <div id="view-one" class="stage"><img id="img" src=""><div class="cap" id="cap"></div></div>
   <div id="view-grid" class="grid" style="display:none"></div>
   <div id="view-dupes" class="dupes" style="display:none"></div>
 </div>
 <div class="side" id="side">
   <h3>Álbumes — pulsa el número</h3>
   <div id="albums"></div>
   <button class="g" style="margin-top:6px;width:100%" onclick="newAlbum()">＋ Nuevo álbum</button>
   <div class="help" id="help"></div>
 </div>
</main>
<script>
let S, view='one', pending=null, sel=new Set(), preload=new Image();
const $=(id)=>document.getElementById(id);
const esc=(s)=>(s||'').replace(/</g,'&lt;');
async function load(){ S=await (await fetch('/state.json')).json(); if(S.cursor>=S.total)S.cursor=Math.max(0,S.total-1); render(); }
function curPhoto(){ return S.photos[S.cursor]; }
function labelFor(code){ if(code==='trash')return '🗑'; const [a,s]=code.split('.'); const al=S.albums.find(x=>x.n==a); if(!al)return code; let t=al.n; if(s)t+='.'+s; return t; }
function setView(v){ view=v; pending=null; $('t-one').className=v==='one'?'on':'g'; $('t-grid').className=v==='grid'?'on':'g'; $('t-dupes').className=v==='dupes'?'on':'g';
  $('view-one').style.display=v==='one'?'flex':'none'; $('view-grid').style.display=v==='grid'?'grid':'none'; $('view-dupes').style.display=v==='dupes'?'block':'none';
  $('side').style.display=v==='dupes'?'none':'block'; render(); }
function render(){ renderAlbums(); if(view==='one')renderOne(); else if(view==='grid')renderGrid(); else renderDupes();
  $('cnt').textContent=S.assignedCount+' / '+S.total; $('prog').style.width=(100*S.assignedCount/S.total)+'%';
  $('selinfo').textContent=(view==='grid'&&sel.size)?(sel.size+' seleccionadas'):''; }
function renderOne(){ const p=curPhoto(); if(!p){$('img').src='';$('cap').textContent='—';return;} $('img').src='/large/'+p.id;
  const ds=new Date(p.iso).toISOString().slice(0,10); const done=p.code?('<span class="done">→ '+labelFor(p.code)+'</span>'):'<span class="mut">sin clasificar</span>';
  $('cap').innerHTML=ds+' · '+(S.cursor+1)+'/'+S.total+' · '+done; const nx=S.photos[S.cursor+1]; if(nx)preload.src='/large/'+nx.id; }
function renderGrid(){ const c=$('view-grid'); if(c._n===S.photos.length && c.childElementCount){ // solo actualizar clases
    for(const p of S.photos){ const t=c.querySelector('[data-id="'+p.id+'"]'); if(t){ t.className='tile'+(sel.has(p.id)?' sel':'')+(p.code==='trash'?' tr':''); const b=t.querySelector('.badge'); b.textContent=p.code?labelFor(p.code):''; b.style.display=p.code?'block':'none'; } } return; }
  c.innerHTML=''; c._n=S.photos.length; const frag=document.createDocumentFragment();
  for(const p of S.photos){ const t=document.createElement('div'); t.className='tile'+(sel.has(p.id)?' sel':'')+(p.code==='trash'?' tr':''); t.dataset.id=p.id;
    t.innerHTML='<img loading="lazy" src="/thumb/'+p.id+'"><span class="badge" style="display:'+(p.code?'block':'none')+'">'+(p.code?labelFor(p.code):'')+'</span>';
    t.onclick=()=>{ if(sel.has(p.id))sel.delete(p.id); else sel.add(p.id); t.classList.toggle('sel'); $('selinfo').textContent=sel.size+' seleccionadas'; };
    frag.appendChild(t); } c.appendChild(frag); }
function renderAlbums(){ const c=$('albums'); c.innerHTML='';
  for(const al of S.albums){ const cnt=S.photos.filter(p=>p.code&&p.code.split('.')[0]==al.n).length;
    const el=document.createElement('div'); el.className='alb'+(pending==al.n?' pending':'');
    let subs=''; for(const su of (al.subs||[])){ const sc=S.photos.filter(p=>p.code===al.n+'.'+su.n).length; subs+='<div class="sub" onclick="apply(\''+al.n+'.'+su.n+'\')"><span class="k">'+al.n+'.'+su.n+'</span><span>'+esc(su.name)+'</span><span class="cn">'+sc+'</span></div>'; }
    el.innerHTML='<div class="h" onclick="clickAlbum('+al.n+')"><span class="k">'+al.n+'</span><span class="nm">'+esc(al.name)+'</span><span class="cn">'+cnt+'</span><button class="g" style="padding:3px 7px" onclick="event.stopPropagation();newSub('+al.n+')">+sub</button></div>'+(al.subs&&al.subs.length?('<div class="subs">'+subs+'</div>'):'');
    c.appendChild(el); }
  $('help').innerHTML=view==='grid'
    ?'<b>Cuadrícula:</b> clic para seleccionar varias, luego pulsa el número del álbum (o clic en él). <kbd>Supr</kbd>=papelera de las seleccionadas. <kbd>Esc</kbd>=deseleccionar.'
    :'<b>1 a 1:</b> <kbd>1</kbd>-<kbd>9</kbd> álbum · si tiene subs, número y luego el del sub (<kbd>1</kbd> <kbd>2</kbd>=1.2). <kbd>→</kbd> saltar · <kbd>←</kbd> atrás · <kbd>Supr</kbd> papelera · <kbd>n</kbd> álbum.'; }
async function renderDupes(){ const c=$('view-dupes'); c.innerHTML='<p class="mut">Analizando fotos parecidas…</p>';
  let r=await (await fetch('/dupes.json')).json();
  if(!r.ready){ c.innerHTML='<p class="mut">Calculando huellas: '+r.done+' / '+r.total+' … (puede tardar unos minutos la 1ª vez). <button class="g" onclick="renderDupes()">Actualizar</button></p>'; return; }
  if(!r.groups.length){ c.innerHTML='<p class="mut">No se han encontrado secuencias de casi-duplicadas (grupos de 4+).</p>'; return; }
  c.innerHTML='<div style="display:flex;gap:10px;align-items:center;margin-bottom:8px"><b>'+r.groups.length+' secuencias detectadas</b><span class="mut">verde = conservar · rojo = a papelera. Ajusta y aplica.</span><span class="sp" style="flex:1"></span><button onclick="applyDupes()">🗑 Enviar rojas a papelera</button></div>';
  DUPES=r.groups; const wrap=document.createElement('div');
  r.groups.forEach((g,gi)=>{ const d=document.createElement('div'); d.className='grp';
    let tiles=''; g.ids.forEach((id,i)=>{ const kill=!g.keep[i]; tiles+='<div class="dt'+(kill?' kill':'')+'" data-g="'+gi+'" data-i="'+i+'"><img loading="lazy" src="/thumb/'+id+'"><span class="tag">'+(kill?'papelera':'conservar')+'</span></div>'; });
    d.innerHTML='<div class="gh"><b>Secuencia '+(gi+1)+'</b><span class="mut">'+g.ids.length+' fotos · conservar '+g.keep.filter(Boolean).length+'</span></div><div class="row">'+tiles+'</div>';
    wrap.appendChild(d); });
  c.appendChild(wrap);
  c.querySelectorAll('.dt').forEach(el=>{ el.onclick=()=>{ const gi=+el.dataset.g,i=+el.dataset.i; DUPES[gi].keep[i]=!DUPES[gi].keep[i]; const kill=!DUPES[gi].keep[i]; el.classList.toggle('kill',kill); el.querySelector('.tag').textContent=kill?'papelera':'conservar'; }; }); }
let DUPES=[];
async function applyDupes(){ const ids=[]; DUPES.forEach(g=>g.ids.forEach((id,i)=>{ if(!g.keep[i])ids.push(id); })); if(!ids.length){toast('nada marcado');return;}
  if(!confirm('Enviar '+ids.length+' fotos a la papelera? (no se borran del disco, quedan fuera de la galería)'))return;
  await fetch('/op',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'assignMany',ids,code:'trash'})});
  for(const id of ids){ const p=S.photos.find(x=>x.id===id); if(p)p.code='trash'; } S.assignedCount=S.photos.filter(p=>p.code).length;
  toast(ids.length+' a papelera'); renderDupes(); }
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),800); }
async function op(b){ await fetch('/op',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}); }
function apply(code){ // asigna: en grid a la selección; en one a la actual
  if(view==='grid'){ if(!sel.size){toast('selecciona fotos');return;} const ids=[...sel]; for(const id of ids){const p=S.photos.find(x=>x.id===id);if(p)p.code=(code===''?null:code);} op({action:'assignMany',ids,code}); S.assignedCount=S.photos.filter(p=>p.code).length; sel.clear(); pending=null; toast(ids.length+' → '+labelFor(code)); render(); return; }
  const p=curPhoto(); if(!p)return; p.code=code||null; S.assignedCount=S.photos.filter(x=>x.code).length; op({action:'assign',id:p.id,code,cursor:Math.min(S.cursor+1,S.total)}); toast('→ '+labelFor(code)); pending=null; next(); }
function tap(n){ const al=S.albums.find(x=>x.n==n); if(!al)return; if(al.subs&&al.subs.length){pending=n;render();} else apply(''+n); }
function clickAlbum(n){ const al=S.albums.find(x=>x.n==n); if(!al)return; if(al.subs&&al.subs.length){pending=(pending==n?null:n);render();} else apply(''+n); }
function chooseSub(sn){ if(pending==null)return; const al=S.albums.find(x=>x.n==pending); if(sn===0){apply(''+pending);return;} if(al.subs.find(x=>x.n==sn))apply(pending+'.'+sn); }
function next(){ if(S.cursor<S.total-1)S.cursor++; render(); op({action:'cursor',cursor:S.cursor}); }
function prev(){ if(S.cursor>0)S.cursor--; pending=null; render(); op({action:'cursor',cursor:S.cursor}); }
function skip(){ pending=null; next(); }
async function newAlbum(){ const name=prompt('Nombre del nuevo álbum (ej. CR):'); if(!name)return; const r=await (await fetch('/op',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'newAlbum',name:name.trim()})})).json(); S.albums=r.albums; render(); }
async function newSub(n){ const al=S.albums.find(x=>x.n==n); if(!al)return; const name=prompt('Sub-álbum dentro de "'+al.name+'":'); if(!name)return; const r=await (await fetch('/op',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'newSub',n,name:name.trim()})})).json(); S.albums=r.albums; render(); }
document.addEventListener('keydown',(e)=>{ if(e.target.tagName==='INPUT')return; const k=e.key;
  if(view==='dupes')return;
  if(k==='ArrowRight'&&view==='one'){e.preventDefault();skip();return;}
  if(k==='ArrowLeft'&&view==='one'){e.preventDefault();prev();return;}
  if(k===' '&&view==='one'){e.preventDefault();skip();return;}
  if(k==='Delete'||k==='Backspace'){e.preventDefault();apply('trash');return;}
  if(k==='Escape'){pending=null;sel.clear();render();return;}
  if(k==='n'||k==='N'){newAlbum();return;}
  if(/^[0-9]$/.test(k)){ const d=parseInt(k,10); if(pending!=null)chooseSub(d); else tap(d); } });
load();
</script></body></html>
